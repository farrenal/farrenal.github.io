<!doctype html>
<!-- Test page, not part of the site. Runs the real scripts with a hand-driven frame clock.
     URL parameters: speed (slider value), frames (number of 60 fps frames to run), field (in / out / off) -->
<html>
<head><meta charset="utf-8"><title>harness</title>
<style>
body{margin:0;background:#888;}
.gif-container{width:1000px;height:600px;position:relative;background:black;}
.responsive-canvas{position:absolute;width:100%;height:100%;}
</style>
</head>
<body>
<div class="gif-container"><canvas class="responsive-canvas" id="objectsCanvas"></canvas><canvas class="responsive-canvas" id="particlesCanvas"></canvas></div>
<p id="debugText"></p><p id="debuggText"></p><p id="debugggText"></p>
<input type="range" min="1" max="100" value="100" id="speedSlider">
<button id="randomButton"></button><button id="pausePlay"><i></i></button>
<pre id="out"></pre>
<script>
window.$ = function(){ return {toggleClass(){}, attr(){}}; };
const realRequestAnimationFrame = window.requestAnimationFrame.bind(window);
window.requestAnimationFrame = () => 0;     // frames are driven by hand below
</script>
<script src="header.js"></script>
<script src="flow_class.js"></script>
<script src="image_class.js"></script>
<script src="image_gl_class.js"></script>
<script src="source_images.js"></script>
<script src="droplet_class.js"></script>
<script src="particle_class.js"></script>
<script src="cloudchamber_class.js"></script>
<script src="helper_functions.js"></script>
<script src="CC_script.js"></script>
<script>
const out = document.getElementById('out');
const log = (m) => { out.textContent += m + "\n"; };
window.onerror = (m, s, l) => log("ERROR " + m + " @" + l);
const params = new URLSearchParams(location.search);
const sliderValue = Number(params.get('speed') || 100);
const frames = Number(params.get('frames') || 30);
const field = params.get('field') || 'in';

// With ?budget=N the time allowed for a frame is N milliseconds (a tiny value forces the picture to get coarser)
if (params.get('budget')) frameBudget = Number(params.get('budget'));
log("picture drawn by the " + (useWebGL ? "graphics card (WebGL)" : "processor") + " (" + webGLStatus + ")");
log("screen pixels per CSS pixel: " + window.devicePixelRatio + ", image at the start: " + imageWidth + " x " + imageHeight + " (imageScale " + imageScale.toFixed(2) + ")");

// --- Numerical checks, no rendering involved ---
theCC.updateMagField('in');

// 1. Speed conservation and radius without drag
let a = new Particle(0, 700, 450, 0.14, 0);
a.energyLoss = 0; a.buffer = 5; a.scatter = 0; a.deltaRaysPerPixel = 0; // never removed by buffer
const speed0 = a.speedNorm;
let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
for (let i = 0; i < 5000; i++) { a.step(); minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x); minY = Math.min(minY, a.y); maxY = Math.max(maxY, a.y); }
log("speed drift after 5000 substeps: " + ((Math.hypot(a.v_x, a.v_y) / speed0) - 1).toExponential(2));
log("measured radius x,y: " + ((maxX - minX) / 2).toFixed(2) + ", " + ((maxY - minY) / 2).toFixed(2) + "   expected gamma m v /(q B dt): " + (a.gamma * speed0 / (magScale * dt)).toFixed(2));

// 2. Same particle advanced at two slider speeds reaches the same point
function run(ticksPerFrame) {
    const q = new Particle(0, 700, 450, 0.5, 0.2);
    q.buffer = 5; const original = q.updateIonisation.bind(q); q.updateIonisation = () => { original(); q.scatter = 0; q.deltaRaysPerPixel = 0; }; q.updateIonisation();
    const total = 3; let t = 0;
    while (t < total - 1e-9) { const d = Math.min(ticksPerFrame, total - t); q.advance(d); t += d; }
    return [q.x, q.y];
}
const slow = run(0.0333), fast = run(66.6);
log("after 3 ticks, slow slider: " + slow[0].toFixed(3) + ", " + slow[1].toFixed(3));
log("after 3 ticks, fast slider: " + fast[0].toFixed(3) + ", " + fast[1].toFixed(3));
theCC.trackDroplets.clear();

// --- Visual check: run a number of frames by hand ---
theCC.updateMagField(field);
speedSlider.value = sliderValue;
speedSlider.oninput();
const L = layerThickness;
theCC.generateParticle(0, 1150, 300, -0.75, 0.2, 0, 0.012);     // e- fast, shallow: several loops in the field
theCC.generateParticle(0, 500, 450, 0.6, 0.2, 0, 0.05);         // e- steeper: about one loop
theCC.generateParticle(1, 300, 750, 0.3, -0.2, L, -0.02);       // e+ slow
theCC.generateParticle(2, 100, 100, 0.85, 0.42, 0, 0.06);       // mu- shallow, long
theCC.generateParticle(2, 700, 100, 0.3, 0.8, L, -0.4);         // mu- steep, short
theCC.generateParticle(4, 200, 850, 0.04, -0.04, 0.5 * L, 0);   // alpha, beta 0.057
theCC.generateParticle(4, 900, 150, -0.04, 0.02, 0.5 * L, 0.01);// alpha, beta 0.045
theCC.generateParticle(5, 1400, 800, -0.058, -0.017, 0.5 * L, 0);   // proton slow, stops in the chamber
theCC.generateParticle(5, 1400, 550, -0.35, -0.1, 0, 0.03);     // proton fast
// With ?random=N the scene is N randomly generated particles instead (two electrons for every other species)
const randomCount = Number(params.get('random') || 0);
if (randomCount > 0) {
    theCC.particlesArray.forEach(list => list.length = 0);
    const mix = [0, 1, 0, 2, 0, 3, 1, 4, 0, 5];
    for (let n = 0; n < randomCount; n++) theCC.generateRandomParticle(mix[n % mix.length]);
}
// With ?event=pair or ?event=decay the scene is three of that event. With ?source=Am-241 (or another name) that source is on.
const eventName = params.get('event');
if (eventName) {
    theCC.particlesArray.forEach(list => list.length = 0);
    if (eventName == 'pair')    for (let n = 0; n < 3; n++) theCC.generateGamma(true);
    if (eventName == 'decay')   for (let n = 0; n < 3; n++) theCC.generateRandomParticle(2 + n % 2, true);
}
if (params.get('source')) {
    theCC.particlesArray.forEach(list => list.length = 0);
    theCC.setSource(params.get('source'));
}
// With ?natural=S the scene is S seconds of particles arriving at the natural rates
const naturalSeconds = Number(params.get('natural') || 0);
if (naturalSeconds > 0) {
    theCC.particlesArray.forEach(list => list.length = 0);
    let frame = 0, nextArrival = 0, arrivals = 0;
    for (let t = 0; t < naturalSeconds; t += 1 / 60) {
        while (nextArrival <= t) {
            theCC.generateNaturalParticle(); arrivals++;
            nextArrival += -Math.log(1 - Math.random()) / (totalNaturalRate() * theCC.dropletClockRate);
        }
        theCC.animate(-1e6 + (frame++) * 1000 / 60);
    }
    theCC.lastFrameTime = null;
    log("natural arrivals in " + naturalSeconds + " s: " + arrivals);
}
// Outcomes chosen at random: count them over many muons and gamma rays, without flying anything
{
    const before = theCC.particlesArray.map(list => list.slice());
    let muonsStopping = 0, pairs = 0;
    const trials = 20000;
    const realStopping = theCC.generateStoppingMuon, realPair = theCC.generatePair, realParticle = theCC.generateParticle;
    theCC.generateStoppingMuon = () => { muonsStopping++; };
    theCC.generatePair = () => { pairs++; };
    theCC.generateParticle = () => null;
    for (let n = 0; n < trials; n++) { theCC.generateRandomParticle(2); theCC.generateGamma(); }
    theCC.generateStoppingMuon = realStopping; theCC.generatePair = realPair; theCC.generateParticle = realParticle;
    theCC.particlesArray = before;
    log("of " + trials + " muons, " + muonsStopping + " decay in the chamber (expected " + trials * muonDecayChance + "); of " + trials + " gamma rays, " + pairs + " make a pair (expected " + trials * gammaPairChance + ")");
}
log("slider " + sliderValue + ": ticks per second " + theCC.ticksPerSecond.toFixed(1) + ", droplet clock rate " + theCC.dropletClockRate.toFixed(3));

let mostDroplets = 0;
const T0 = performance.now();
for (let f = 0; f <= frames; f++) {
    theCC.animate(f * 1000 / 60);
    mostDroplets = Math.max(mostDroplets, theCC.trackDroplets.count);
}
const T1 = performance.now();
// With ?zoom=N the screen is made to report N times as many pixels after the frames have run, as when the user zooms in
if (params.get('zoom')) {
    Object.defineProperty(window, 'devicePixelRatio', {value: Number(params.get('zoom')), configurable: true});
    theCC.updateImageScale();
    for (let f = frames + 1; f <= frames + 5; f++) theCC.animate(f * 1000 / 60);
    log("after zooming to " + params.get('zoom') + ": image " + imageWidth + " x " + imageHeight);
}
log("image at the end: " + imageWidth + " x " + imageHeight + " (imageScale " + imageScale.toFixed(2) + ")");
log("ran " + frames + " frames = " + (frames / 60).toFixed(2) + " s, average ms per frame: " + ((T1 - T0) / (frames + 1)).toFixed(2));
log("track droplets now: " + theCC.trackDroplets.count + " (most: " + mostDroplets + "), background droplets: " + theCC.backgroundDroplets.count
    + ", particles still flying: " + theCC.particlesArray.reduce((n, x) => n + x.length, 0));
</script>
</body>
</html>
<script>
// How much of the picture is lit, read back from the canvas (works for both ways of drawing)
{
    const copy = document.createElement('canvas'); copy.width = 300; copy.height = 180;
    const copyContext = copy.getContext('2d');
    theCC.image.clear(); theCC.backgroundDroplets.render(theCC.image, theCC.flow, 0); theCC.trackDroplets.render(theCC.image, theCC.flow, 0); theCC.image.develop();
    copyContext.drawImage(canvas, 0, 0, 300, 180);
    const data = copyContext.getImageData(0, 0, 300, 180).data;
    let lit = 0, total = 0;
    for (let i = 3; i < data.length; i += 4) { if (data[i] > 8) lit++; total += data[i]; }
    if (useWebGL) log("WebGL error code after drawing (0 means none): " + gl.getError());
    log("picture read back: " + lit + " of 54000 sample pixels lit, average opacity " + (total / 54000).toFixed(2) + " of 255");
}
// A picture drawn by the graphics card is only kept until it has been shown once, so keep redrawing it
// (without letting any time pass) for as long as the page is open, for screenshots
(function keepShowing() {
    if (params.get('timing')) return;
    theCC.image.clear(); theCC.backgroundDroplets.render(theCC.image, theCC.flow, 0); theCC.trackDroplets.render(theCC.image, theCC.flow, 0); theCC.image.develop();
    realRequestAnimationFrame(keepShowing);
})();
// Cost of the separate parts of a frame, with whatever droplets are left (only with ?timing=1, it spoils the picture)
if (params.get('timing')) {
    const time = (label, repeat, work) => { const t = performance.now(); for (let r = 0; r < repeat; r++) work(); log(label + ": " + ((performance.now() - t) / repeat).toFixed(2) + " ms"); };
    time("clear image", 50, () => theCC.image.clear());
    time("update flow", 50, () => theCC.flow.update(0));
    time("droplets (" + (theCC.trackDroplets.count + theCC.backgroundDroplets.count) + ")", 50, () => { theCC.trackDroplets.render(theCC.image, theCC.flow, 0); theCC.backgroundDroplets.render(theCC.image, theCC.flow, 0); });
    time("develop image", 50, () => theCC.image.develop());
}
</script>
