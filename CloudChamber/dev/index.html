<!doctype html>
<html lang="en">
<head>
    <title>Alexander Farren</title>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link href='https://fonts.googleapis.com/css?family=Fira Sans Condensed' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="apple-touch-icon" type="image/png" href="https://farrenal.github.io/Images/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://farrenal.github.io/Images/android-chrome-512x512.png">
    <link rel="stylesheet" href="CC_styles.css">
    <script src="/MathJax/MathJax.js" type="text/javascript">
        MathJax.Hub.Config({
        config: ["MMLorHTML.js"],
        extensions: ["tex2jax.js"],
        jax: ["input/TeX"],
        tex2jax: {inlineMath: ["\\(","\\)"]}
        });
    </script>
    <script src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML" type="text/javascript"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
</head>

<body>
<div class = "desktop-only-intro">
    <h1 class="title">Interactive Cloud Chamber</h1>
</div>
<div class="mobile-only-intro">
    <h1 class="title">Interactive Cloud Chamber</h1>
</div>

<table class="maintable">
  <tr>
    <td style="padding:10px">
      <div class="gif-container" id="poopoo">
        <canvas class="responsive-canvas" id="objectsCanvas"></canvas>
        <canvas class="responsive-canvas" id="particlesCanvas"></canvas>
      </div>
      <p id="debugText" hidden></p>
      <p id="debuggText" hidden></p>
      <p id="debugggText" hidden></p>
      <div class="controls">
        <div class="controls-column">
          <section class="panel">
            <h3 class="panel-title">Magnetic field</h3>
            <div class="button-row">
              <button type="button" class="btn f" title="Field pointing out of the screen" onclick="fieldClicked('out');changeFieldColour(this);">\(\bigodot\)</button>
              <button type="button" class="btn f" title="Field pointing into the screen" onclick="fieldClicked('in');changeFieldColour(this);">\(\bigotimes\)</button>
              <button type="button" class="btn f text is-active" title="No field" onclick="fieldClicked('off');changeFieldColour(this);">off</button>
            </div>
          </section>
          <section class="panel">
            <h3 class="panel-title">Playback <span class="panel-note" id="speedSliderText"></span></h3>
            <div class="button-row">
              <label class="speed">Speed
                <input type="range" min="1" max="100" value="100" id="speedSlider">
              </label>
              <button type="button" class="btn icon" id="pausePlay" title="Pause or resume" onclick="theCC.toggleAnimation();"><i class="material-icons">pause</i></button>
              <button type="button" class="btn icon" id="clearCC" title="Clear the chamber" onclick="theCC.clearAnimation();"><i class="material-icons">stop</i></button>
            </div>
          </section>
          <section class="panel">
            <h3 class="panel-title">Natural background</h3>
            <div class="button-row">
              <button type="button" class="btn text" id="randomButton" title="Cosmic rays and background radiation, at their natural rates" onclick="toggleRandom();">Random particles</button>
            </div>
          </section>
        </div>
        <div class="controls-column">
          <section class="panel">
            <h3 class="panel-title">Send in particle</h3>
            <div class="button-row">
              <button type="button" class="btn p" onclick="particleClicked('e-');changeParticleColour(this);">\(e^{-}\)</button>
              <button type="button" class="btn p" onclick="particleClicked('e+');changeParticleColour(this);">\(e^{+}\)</button>
              <button type="button" class="btn p" onclick="particleClicked('mu-');changeParticleColour(this);">\(\mu^{-}\)</button>
              <button type="button" class="btn p" onclick="particleClicked('mu+');changeParticleColour(this);">\(\mu^{+}\)</button>
              <button type="button" class="btn p" onclick="particleClicked('p+');changeParticleColour(this);">\(p\)</button>
              <button type="button" class="btn p" onclick="particleClicked('a+');changeParticleColour(this);">\(\alpha\)</button>
            </div>
          </section>
          <section class="panel">
            <h3 class="panel-title">Activate event</h3>
            <div class="button-row">
              <button type="button" class="btn event" title="A gamma ray turns into an electron and a positron" onclick="eventClicked('pair');flashButton(this);">\(\gamma \to e^{+}e^{-}\)</button>
              <button type="button" class="btn event" title="A slow muon stops and decays into an electron" onclick="eventClicked('muonDecay');flashButton(this);">\(\mu \to e\,\nu\bar{\nu}\)</button>
            </div>
          </section>
          <section class="panel">
            <h3 class="panel-title">Activate source</h3>
            <div class="button-row">
              <button type="button" class="btn s text" data-source="Am-241" title="Americium-241: alpha particles which all have the same energy" onclick="toggleSource('Am-241');">Am-241 (\(\alpha\))</button>
              <button type="button" class="btn s text" data-source="Th-232" title="Thorium-232 and its decay products: alpha particles of several energies, and pairs of alphas from thoron gas" onclick="toggleSource('Th-232');">Th-232 (\(\alpha\))</button>
              <button type="button" class="btn s text" data-source="Sr-90" title="Strontium-90: electrons with a wide spread of energies" onclick="toggleSource('Sr-90');">Sr-90 (\(\beta^{-}\))</button>
              <button type="button" class="btn s text" data-source="Na-22" title="Sodium-22: positrons with a wide spread of energies" onclick="toggleSource('Na-22');">Na-22 (\(\beta^{+}\))</button>
              <button type="button" class="btn s text" data-source="Cs-137" title="Caesium-137: gamma rays, seen only through the electrons which they knock out of the gas" onclick="toggleSource('Cs-137');">Cs-137 (\(\gamma\))</button>
            </div>
          </section>
        </div>
      </div>
      <script src="header.js"></script>
      <script src="flow_class.js"></script>
      <script src="image_class.js"></script>
      <script src="source_images.js"></script>
      <script src="droplet_class.js"></script>
      <script src="particle_class.js"></script>
      <script src="cloudchamber_class.js"></script>
      <script src="helper_functions.js"></script>
      <script src="CC_script.js"></script>
    </td>
  </tr>
</table>

<script> 
   $('.clickables').attr('target', '_blank'); 
</script>
</body>
</html>
